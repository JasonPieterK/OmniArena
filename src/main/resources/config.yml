# OmniArena Global Configuration
# Changes take effect on /oa reload (no restart required)

plugin:
  debug: false

tools:
  wand-material: WOODEN_HOE  # item used as the region selection wand

arena:
  # default-* and the options below seed NEW arenas (per-arena files override them)
  default-min-players: 2
  default-max-players: 16
  default-countdown: 10
  default-match-duration: 600  # seconds
  default-game-mode: DEATHMATCH
  lobby-timeout: 120  # seconds below min players before the lobby is closed (0 = never)
  spectator-allowed: true
  mid-match-join: false
  respawn-delay: 3  # seconds
  spawn-protection: 3  # seconds of invulnerability on spawn
  inventory-restore: true  # restore player gear on leave
  persist-player-state: true  # also write each player's pre-arena state to plugins/OmniArena/player-states/<uuid>.yml (async) so a crash cannot lose inventories; restored + deleted on next join
  region-protection: true  # block break/place inside arena regions while no match is running (admins bypass)

match:
  end-commands: []  # Commands run on match end. Use {winner}, {loser}, {arena}, {mode}
  # Example:
  # - "give {winner} diamond 1"
  # - "broadcast {winner} won in {arena}!"
  end-delay: 5  # seconds before match resets after end
  announce-global: false  # broadcast match results to whole server
  announce-arena: true

regen:
  auto: true  # rebuild the arena from its snapshot after every match (per arena: regen.arenas.<name>.auto)
  batch-size: 4000  # blocks restored per tick; higher = faster, lower = smoother
  progress:
    enabled: true
    interval-percent: 10  # chat progress updates every N percent
  animation:
    type: SPHERE  # INSTANT, SPHERE, RISE, FALL, SWEEP, TIME_REWIND, GALAXY, HOLOGRAM_SCAN, METEOR_SHOWER, OVERGROWTH (old names are mapped)
    particles: true
    sound: true

# ── PvP / Combat management (PvPManager-style, server-wide) ──
pvp:
  enabled: true
  combat:
    tag-duration: 15          # seconds you stay "in combat" after a hit
    tag-on-damage: true
    tag-on-attack: true
    block-teleport: true      # block non-plugin teleports (/tpa, /tp, /home...) while tagged; OmniArena's own are allowed
    block-elytra: true        # no elytra gliding / firework boost while tagged
    block-ender-pearl: false  # block ender pearl teleports while tagged
    block-commands: true      # block commands while tagged (except allowed list)
    allowed-commands:
      - /oa
      - /pvp
      - /msg
      - /r
      - /helpop
    block-block-place: true
    disable-fly: true         # drop flight the moment combat starts
    disable-gamemode: true    # force survival on combat
    disable-invisibility: true # strip invisibility potion on combat
    disable-disguise: true    # undisguise (LibsDisguises) on combat
    punish-combat-log: true
    combat-log-action: KILL   # KILL, COMMAND, or NOTHING
    combat-log-commands: []   # used when action is COMMAND; {player} replaced
    drop-on-combat-log: true
    broadcast-combat-log: true
  toggle:
    enabled: true
    cooldown: 5               # seconds between /pvp toggles
    default-state: true       # PvP on by default for new players
  global:
    pvp-enabled: true         # server-wide master PvP switch
  newbie:
    enabled: true
    duration: 300             # seconds of protection for new players
    disable-on-attack: true   # protection drops if a newbie attacks someone
    block-pickup: false
  killabuse:
    enabled: true
    max-kills: 3              # kills on the same victim before it stops counting
    time-window: 300         # seconds the kill window spans
  respawn-protection:
    enabled: true
    duration: 5              # seconds of invulnerability after respawn
  border-hopping:
    prevent: true            # tagged players can't flee into safe zones
  auto-soup:
    enabled: false
    heal-amount: 3.5         # half-hearts healed per soup
    soup-material: MUSHROOM_STEW
  blood:
    enabled: true
    block: REDSTONE_BLOCK    # block-break particle used for the blood splash
  transfer-drops: false      # send a victim's drops straight to their killer
  block-lava-fire-near-disabled: true
  lava-fire-radius: 5.0      # block lava/fire placement within this many blocks of a protected player
  disabled-worlds: []        # worlds where PvP is fully off

rewards:
  enabled: false  # money needs Vault (integrations.vault)
  kill-money: 10.0
  win-money: 50.0
  kill-xp: 5
  win-xp: 20
  win-commands: []   # console commands run for each winner; {player}, {arena}
  kill-commands: []  # console commands run per kill; {player}, {victim}, {arena}

kits:
  player-kits-enabled: true
  default-slot-limit: 3  # personal kit slots per player
  power-cap:
    enabled: true
    max-enchant-level: 5
    banned-items:
      - BEDROCK
      - COMMAND_BLOCK
      - BARRIER
      - SPAWNER
      - CHAIN_COMMAND_BLOCK
      - REPEATING_COMMAND_BLOCK
      - STRUCTURE_BLOCK
  sharing-enabled: true

party:
  max-size: 10  # maximum players in one party (minimum 2)

signs:
  glow-effect: true  # place glowstone behind arena signs
  update-interval: 20  # ticks between sign refreshes

visual:
  titles: true
  sounds: true
  particles: true
  scoreboard: true
  boss-bar: true
  action-bar: true
  killstreak-titles: true
  kill-announcements: true
  victory-fireworks: true
  countdown-sounds: true
  spectator-invisibility: true

killstreak:
  milestones:
    5: "KILLING SPREE"
    10: "DOMINATING"
    15: "UNSTOPPABLE"
    20: "GODLIKE"
  sound: ENTITY_LIGHTNING_BOLT_THUNDER
  particle: FLAME

scoreboard:
  title: "<gradient:#ff6b35:#f7c59f>OmniArena</gradient>"
  update-interval: 20  # ticks (minimum effective 20 = 1s)

boss-bar:
  timer-color: GREEN
  waiting-color: YELLOW  # waiting/starting
  ending-color: PURPLE
  low-time-color: RED  # color when < 60s remain
  low-time-threshold: 60

integrations:
  vault: true
  placeholderapi: true
  worldguard: true
  luckperms: true
  # Leaderboard placeholders for any hologram plugin (needs PlaceholderAPI): %omniarena_top_<kills|wins|kd|elo>_<1-10>_name%
  # and ..._value%, plus %omniarena_elo%, %omniarena_rank%, %omniarena_arena%, %omniarena_in_match%.
  # DecentHolograms: /oa leaderboard create <id> [kills|wins|kd|elo] [size] makes a hologram there. Needs the plugin installed.
  decentholograms: true
  # FancyHolograms: same command; used when DecentHolograms is not installed.
  fancyholograms: true
  # Citizens: /oa npc create <menu|join|queue|spectate> binds NPC right-clicks to menus, joining, queueing, spectating.
  citizens: true
  # Multiverse-Core: lets /oa arena tp and /oa setup load an arena's world on demand when it is not loaded.
  multiverse: true
  tab:
    # TAB (https://modrinth.com/plugin/tab-was-taken) compatibility.
    # When takeover is true, OmniArena stops drawing its own sidebar + bossbar
    # so TAB can render them from our PlaceholderAPI placeholders instead.
    # Placeholders: %omniarena_gamemode_name%, %omniarena_state%, %omniarena_arena%,
    #   %omniarena_arena_kills%, %omniarena_alive%, %omniarena_players%,
    #   %omniarena_time_left%, %omniarena_team%, %omniarena_team_color% (+ lifetime stats)
    takeover: false

# Self-healing: config repair, watchdog and /oa doctor
health:
  enabled: true              # master switch for the runtime watchdog (config repair at startup always runs)
  watchdog-seconds: 30       # how often the watchdog checks arenas, matches, players and background tasks
  stuck-arena-seconds: 180   # an arena in ENDING/RESETTING (no regen running) longer than this is force-cleaned
  notify-admins: true        # tell admins on join "OmniArena fixed N problems - /oa doctor" after a repair
  backups-to-keep: 10        # config.yml/messages.yml backups kept per file in plugins/OmniArena/backups/

web:
  enabled: true
  # Interface the dashboard listens on. 127.0.0.1 = local only (safe default).
  # Set to 0.0.0.0 for remote access, but put it behind a reverse proxy with HTTPS
  # (the session token is sent in the URL/query string).
  bind-address: 127.0.0.1
  port: 8123
  public-url: ""  # optional base URL for generated editor links
  session-minutes: 30
  max-sessions: 1
  title: OmniArena Control

betting:
  enabled: true
  min-bet: 100.0
  max-bet: 10000.0
  allow-spectator-bet: true
  bet-window-seconds: 30

tournament:
  walkover-grace-seconds: 60   # wait this long for an offline player before awarding a walkover
