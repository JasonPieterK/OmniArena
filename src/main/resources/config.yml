# ============================================================================
# OmniArena configuration
# Edit, then run /oa reload (no restart needed, except the web and advanced.web keys).
# Every key lists its default and allowed values. Missing keys are filled in automatically.
# Old (pre-2.0 layout) files are migrated automatically; a backup goes to plugins/OmniArena/backups/.
# ============================================================================
config-version: 2  # internal, do not edit

# ── General ──────────────────────────────────────────────────────────────────
general:
  startup-banner: full         # full | compact | off (default full): console banner; full animates on a real terminal, plain consoles get one static frame
  debug: false                 # true/false (default false): verbose console diagnostics
  wand-material: WOODEN_HOE    # any item name (default WOODEN_HOE): the region selection wand

# ── Arenas: defaults for NEWLY created arenas (existing arenas keep their own values) ──
arenas:
  min-players: 2               # whole number >= 1 (default 2)
  max-players: 16              # whole number >= min-players (default 16)
  countdown: 10                # seconds, 0+ (default 10): lobby countdown before a match
  match-duration: 600          # seconds, 1+ (default 600)
  game-mode: DEATHMATCH        # a game type name, see /oa help (default DEATHMATCH)
  spectator-allowed: true      # true/false (default true)
  mid-match-join: false        # true/false (default false): allow joining a running match
  respawn-delay: 3             # seconds, 0+ (default 3)
  spawn-protection: 3          # seconds of invulnerability after spawning, 0+ (default 3)
  # Applies to ALL arenas (not just new ones):
  region-protection: true      # true/false (default true): block break/place in arena regions between matches (admins bypass)
  sign-glow: true              # true/false (default true): put glowstone behind arena join signs

# ── Matches (all arenas) ─────────────────────────────────────────────────────
matches:
  end-delay: 5                 # seconds, 0+ (default 5): pause between match end and reset
  lobby-timeout: 120           # seconds, 0+ (default 120; 0 = never): lobby closes after this long below the minimum players
  inventory-restore: true      # true/false (default true): give players their own gear back when they leave
  announce-arena: true         # true/false (default true): announce the result inside the arena
  announce-global: false       # true/false (default false): announce the result to the whole server
  # Console commands run when a match ends. Placeholders: {winner} {loser} {arena} {mode}
  # Example: ["give {winner} diamond 1", "broadcast {winner} won in {arena}!"]
  end-commands: []

# ── Regeneration (arena rebuild after each match) ────────────────────────────
regen:
  auto: true                   # true/false (default true): rebuild from the snapshot after every match
  style: SPHERE                # INSTANT, SPHERE, RISE, FALL, SWEEP, TIME_REWIND, GALAXY, HOLOGRAM_SCAN, METEOR_SHOWER, OVERGROWTH (default SPHERE)
  particles: true              # true/false (default true): particle effects during the rebuild
  sound: true                  # true/false (default true): sound effects during the rebuild
  progress-messages: true      # true/false (default true): chat progress updates during a manual /oa regen
  # Per-arena override (managed by /oa regen auto <arena> <true|false|default>):
  # arenas:
  #   <arena-name-lowercase>:
  #     auto: false

# ── Ranked play: queue and parties ───────────────────────────────────────────
ranked:
  party-max-size: 10           # whole number >= 2 (default 10): players per party

# ── Kits ─────────────────────────────────────────────────────────────────────
kits:
  player-kits-enabled: true    # true/false (default true): players may save personal kits
  default-slot-limit: 3        # whole number (default 3): personal kit slots per player
  sharing-enabled: true        # true/false (default true): players may share kits
  power-cap:
    enabled: true              # true/false (default true): sanitise kits (enchant cap, banned items)
    max-enchant-level: 5       # whole number (default 5)
    banned-items:              # item names that can never be in a kit
      - BEDROCK
      - COMMAND_BLOCK
      - BARRIER
      - SPAWNER
      - CHAIN_COMMAND_BLOCK
      - REPEATING_COMMAND_BLOCK
      - STRUCTURE_BLOCK

# ── Rewards (money needs Vault, see integrations.vault) ──────────────────────
rewards:
  enabled: false               # true/false (default false)
  kill-money: 10.0             # number >= 0 (default 10.0)
  win-money: 50.0              # number >= 0 (default 50.0)
  kill-xp: 5                   # whole number (default 5)
  win-xp: 20                   # whole number (default 20)
  win-commands: []             # console commands per winner; {player} {arena}
  kill-commands: []            # console commands per kill; {player} {victim} {arena}

# ── Betting (needs Vault) ────────────────────────────────────────────────────
betting:
  enabled: true                # true/false (default true)
  min-bet: 100.0               # number >= 0 (default 100.0)
  max-bet: 10000.0             # number >= min-bet (default 10000.0)
  allow-spectator-bet: true    # true/false (default true): spectators of the match may bet
  bet-window-seconds: 30       # seconds (default 30): betting stays open this long after the match starts

# ── Tournaments ──────────────────────────────────────────────────────────────
tournaments:
  walkover-grace-seconds: 60   # seconds (default 60): wait for an offline player before awarding a walkover

# ── PvP and combat management (server-wide, PvPManager-style) ────────────────
pvp:
  enabled: true                # true/false (default true): master switch for everything under pvp
  server-pvp: true             # true/false (default true): server-wide PvP on/off (also set by /pvp global)
  disabled-worlds: []          # world names where PvP is fully off
  transfer-drops: false        # true/false (default false): a victim's drops go straight to the killer
  combat:
    tag-duration: 15           # seconds in combat after a hit (default 15)
    tag-on-damage: true        # true/false (default true): taking damage tags you
    tag-on-attack: true        # true/false (default true): attacking tags you
    block-teleport: true       # true/false (default true): block /tpa, /tp, /home... while tagged (OmniArena's own are allowed)
    block-elytra: true         # true/false (default true): no elytra gliding or firework boost while tagged
    block-ender-pearl: false   # true/false (default false): block ender pearls while tagged
    block-commands: true       # true/false (default true): block commands while tagged (except allowed-commands)
    allowed-commands:          # commands still allowed while tagged
      - /oa
      - /pvp
      - /msg
      - /r
      - /helpop
    block-block-place: true    # true/false (default true): no block placing while tagged
    disable-fly: true          # true/false (default true): drop flight when combat starts
    disable-gamemode: true     # true/false (default true): force survival when combat starts
    disable-invisibility: true # true/false (default true): strip invisibility when combat starts
    disable-disguise: true     # true/false (default true): undisguise (LibsDisguises) when combat starts
    punish-combat-log: true    # true/false (default true): punish quitting while tagged
    combat-log-action: KILL    # KILL, COMMAND or NOTHING (default KILL)
    combat-log-commands: []    # run when combat-log-action is COMMAND; {player} is replaced
    drop-on-combat-log: true   # true/false (default true): the combat logger's items drop
    broadcast-combat-log: true # true/false (default true): announce combat logging
  toggle:
    enabled: true              # true/false (default true): players may use /pvp to switch PvP off for themselves
    cooldown: 5                # seconds between /pvp toggles (default 5)
    default-state: true        # true/false (default true): PvP on for new players
  newbie:
    enabled: true              # true/false (default true): protect first-time players
    duration: 300              # seconds of protection (default 300)
    disable-on-attack: true    # true/false (default true): protection ends if the newbie attacks
    block-pickup: false        # true/false (default false): protected players cannot pick up items
  killabuse:
    enabled: true              # true/false (default true): stop farming the same victim
    max-kills: 3               # kills on one victim before they stop counting (default 3)
    time-window: 300           # seconds the kill window spans (default 300)
  respawn-protection:
    enabled: true              # true/false (default true)
    duration: 5                # seconds of invulnerability after respawn (default 5)
  border-hopping:
    prevent: true              # true/false (default true): tagged players cannot flee into safe zones
  auto-soup:
    enabled: false             # true/false (default false)
    heal-amount: 3.5           # half-hearts healed per soup (default 3.5)
    soup-material: MUSHROOM_STEW # item name (default MUSHROOM_STEW)
  blood:
    enabled: true              # true/false (default true): blood splash on hit
    block: REDSTONE_BLOCK      # block name used for the particles (default REDSTONE_BLOCK)
  block-lava-fire-near-disabled: true # true/false (default true): no lava/fire placement near players with PvP off
  lava-fire-radius: 5.0        # blocks (default 5.0): radius for the option above

# ── Visuals (global switches; each arena can also switch channels off) ───────
visuals:
  titles: true                 # true/false (default true)
  sounds: true                 # true/false (default true)
  particles: true              # true/false (default true)
  scoreboard: true             # true/false (default true): sidebar
  boss-bar: true               # true/false (default true)
  action-bar: true             # true/false (default true)
  killstreak-titles: true      # true/false (default true)
  kill-announcements: true     # true/false (default true)
  victory-fireworks: true      # true/false (default true)
  countdown-sounds: true       # true/false (default true)
  spectator-invisibility: true # true/false (default true)
  scoreboard-title: "<gradient:#ff6b35:#f7c59f>OmniArena</gradient>" # MiniMessage text
  boss-bar-colors:             # BLUE, GREEN, PINK, PURPLE, RED, WHITE or YELLOW
    timer: GREEN               # default GREEN: normal match timer
    waiting: YELLOW            # default YELLOW: waiting/starting
    ending: PURPLE             # default PURPLE: match ending
    low-time: RED              # default RED: little time left
    low-time-seconds: 60       # seconds (default 60): "little time" threshold
  killstreak:
    sound: ENTITY_LIGHTNING_BOLT_THUNDER # sound name (default ENTITY_LIGHTNING_BOLT_THUNDER)
    particle: FLAME            # particle name (default FLAME)
    milestones:                # kills in a row: announcement text
      5: "KILLING SPREE"
      10: "DOMINATING"
      15: "UNSTOPPABLE"
      20: "GODLIKE"

# ── Integrations (each needs the other plugin installed; true/false, default true) ──
integrations:
  vault: true                  # economy for rewards, bets, tournament prizes
  placeholderapi: true         # %omniarena_...% placeholders (leaderboards for any hologram plugin: %omniarena_top_<kills|wins|kd|elo>_<1-10>_name% / _value%)
  worldguard: true
  luckperms: true
  decentholograms: true        # /oa leaderboard create <id> [kills|wins|kd|elo] [size]
  fancyholograms: true         # same command, used when DecentHolograms is not installed
  citizens: true               # /oa npc create <menu|join|queue|spectate>
  multiverse: true             # /oa arena tp and /oa setup can load an arena's world on demand
  tab:
    # TAB compatibility. true = OmniArena stops drawing its own sidebar and boss bar so TAB can show
    # them from our PlaceholderAPI placeholders (%omniarena_gamemode_name%, %omniarena_state%, %omniarena_alive%, ...).
    takeover: false            # true/false (default false)

# ── Web dashboard ────────────────────────────────────────────────────────────
web:
  enabled: true                # true/false (default true)
  # 127.0.0.1 = this machine only (safe default). Use 0.0.0.0 for remote access, but put it behind an HTTPS reverse proxy.
  bind-address: 127.0.0.1
  port: 8123                   # 1-65535 (default 8123)
  public-url: ""               # optional base URL used in generated editor links
  title: OmniArena Control     # dashboard title text

# ── Self-healing: config repair, watchdog and /oa doctor ─────────────────────
health:
  enabled: true                # true/false (default true): runtime watchdog (config repair at startup always runs)
  notify-admins: true          # true/false (default true): tell admins on join when something was repaired
  backups-to-keep: 10          # whole number >= 1 (default 10): config/messages backups kept in plugins/OmniArena/backups/

# ── Advanced: rarely needed tuning, safe to leave alone ──────────────────────
advanced:
  persist-player-state: true   # true/false (default true): write each player's pre-arena state to player-states/<uuid>.yml so a crash cannot lose inventories
  regen:
    batch-size: 4000           # blocks per tick (default 4000): higher = faster rebuild, lower = smoother
    progress-interval-percent: 10 # 1-100 (default 10): chat progress step during manual regen
  signs:
    update-interval: 20        # ticks (default 20): how often join signs refresh
  scoreboard:
    update-interval: 20        # ticks (default 20): sidebar refresh (20 = 1 second is the effective minimum)
  health:
    watchdog-seconds: 30       # seconds (default 30): how often the watchdog checks arenas and matches
    stuck-arena-seconds: 180   # seconds (default 180): an arena stuck in ENDING/RESETTING this long is force-cleaned
  web:
    session-minutes: 30        # minutes (default 30): dashboard login lifetime (needs a restart)
    max-sessions: 1            # whole number (default 1): simultaneous dashboard logins (needs a restart)
