# OmniArena Messages Configuration
# Supports MiniMessage format: https://docs.advntr.dev/minimessage/format.html

prefix: "<dark_gray>[<gradient:#ff6b35:#f7c59f>OmniArena</gradient><dark_gray>] "

# General
no-permission: "<red>You don't have permission to do that."
player-only: "<red>This command is for players only."
plugin-stopped: "<red>OmniArena is currently stopped."
unknown-command: "<red>Unknown command. Use <yellow>/oa help</yellow> for help."
invalid-args: "<red>Invalid usage. <yellow>{usage}"
player-not-found: "<red>Player <yellow>{player}</yellow> not found."
arena-not-found: "<red>Arena <yellow>{arena}</yellow> not found."
invalid-number: "<red><yellow>{input}</yellow> is not a valid number."
arena-banned: "<red>You are banned from this arena."
config-reloaded: "<green>Configuration reloaded successfully."
plugin-version: "<gray>OmniArena <green>v{version} <gray>by OmniArena Team."

# Arena Management
arena-created: "<green>Arena <yellow>{arena}</yellow> created successfully."
arena-deleted: "<red>Arena <yellow>{arena}</yellow> deleted."
arena-enabled: "<green>Arena <yellow>{arena}</yellow> is now <green>enabled</green>."
arena-disabled: "<yellow>Arena <yellow>{arena}</yellow> is now <red>disabled</red>."
arena-already-exists: "<red>Arena <yellow>{arena}</yellow> already exists."
arena-list-header: "<gold>--- Arenas ({count}) ---"
arena-list-entry: " <gray>- <yellow>{arena} <dark_gray>| <gray>Mode: <white>{mode} <dark_gray>| <gray>Status: {status} <dark_gray>| <gray>Players: <white>{players}/{max}"
arena-info-header: "<gold>=== Arena: {arena} ==="
arena-info-mode: " <gray>Mode: <white>{mode}"
arena-info-status: " <gray>Status: {status}"
arena-info-players: " <gray>Players: <white>{players}/{max}"
arena-info-region: " <gray>Region: <white>{region}"
arena-info-spawns: " <gray>Spawns: <white>{spawns}"

# Match
match-starting: "<yellow>Match starting in <gold>{seconds}</gold> seconds!"
match-started: "<green>Match started! Good luck!"
match-ended: "<gold>Match over! {result}"
match-winner: "<gold>Winner: <yellow>{winner}"
match-draw: "<gray>The match ended in a draw."
match-force-started: "<green>Match in <yellow>{arena}</yellow> force-started."
match-force-stopped: "<red>Match in <yellow>{arena}</yellow> force-stopped."
match-not-running: "<red>No active match in <yellow>{arena}</yellow>."
match-already-running: "<red>A match is already running in <yellow>{arena}</yellow>."

# Join / Leave
join-arena: "<green>You joined arena <yellow>{arena}</yellow>!"
leave-arena: "<yellow>You left arena <yellow>{arena}</yellow>."
already-in-arena: "<red>You are already in an arena."
not-in-arena: "<red>You are not in an arena."
arena-full: "<red>Arena <yellow>{arena}</yellow> is full ({max} players)."
arena-disabled-join: "<red>Arena <yellow>{arena}</yellow> is disabled."
arena-in-progress: "<yellow>Arena <yellow>{arena}</yellow> is in progress. Join as spectator? <green>[Click]"
match-min-players: "<yellow>Waiting for players... <gray>({current}/{min} needed)"

# Spectator
spectate-joined: "<gray>You are now spectating <yellow>{arena}</yellow>."
spectate-left: "<gray>You left spectator mode."
spectate-not-allowed: "<red>Spectating is not allowed in this arena."
spectate-follow: "<gray>Following <yellow>{player}</yellow>. Sneak to stop."

# Kill / Death
kill-announcement: "<red>{killer} <dark_gray>[<red>{killer_kills}<dark_gray>] <gray>killed <yellow>{victim} <gray>with <white>{weapon}<gray>."
death-message: "<red>You were killed by <yellow>{killer}</yellow>."
eliminated: "<red>You were eliminated! <gray>Spectating until the round ends."

# ── PvP / Combat ──
combat-tagged: "<red>⚔ You are now in combat! <gray>Don't log out."
combat-untagged: "<green>You are no longer in combat."
combat-expired: "<green>⚔ You are out of combat."
combat-log: "<dark_red>{player} logged out in combat and was slain!"
combat-no-command: "<red>You can't use that command while in combat."
combat-no-teleport: "<red>You can't teleport while in combat."
combat-no-place: "<red>You can't place blocks while in combat."
combat-no-safezone: "<red>You can't enter a safe zone while in combat!"
combat-no-lavafire: "<red>You can't place lava or fire near a protected player."
pvp-global-off: "<red>PvP is disabled on this server."
pvp-world-off: "<red>PvP is disabled in this world."
pvp-newbie-victim: "<red>That player is under newbie protection."
pvp-respawn-protected: "<red>That player just respawned and is protected."
pvp-newbie-self: "<red>You are protected — attack to give up protection."
pvp-victim-disabled: "<red>That player has PvP disabled."
pvp-self-disabled: "<red>You have PvP disabled. Use /oa pvp to enable it."
pvp-enabled-self: "<green>Your PvP is now <bold>ON</bold>."
pvp-disabled-self: "<yellow>Your PvP is now <bold>OFF</bold>."
pvp-global-on-broadcast: "<green>PvP has been enabled server-wide."
pvp-global-off-broadcast: "<red>PvP has been disabled server-wide."
newbie-granted: "<aqua>Welcome! You have newbie protection. <gray>Attack anyone to give it up."
newbie-disabled: "<yellow>Newbie protection disabled."
first-blood: "<dark_red>FIRST BLOOD! <yellow>{killer}</yellow> drew first blood on <yellow>{victim}</yellow>!"
killstreak-self: "<gold>KILLSTREAK x{streak}! {title}"
killstreak-broadcast: "<yellow>{player}</yellow> is on a <gold>{streak} killstreak</gold>! ({title})"
killstreak-broken: "<green>You broke <yellow>{player}'s</yellow> <gold>{streak}</gold> killstreak!"
combo-counter: "<gold>x{combo} COMBO!"
revenge-kill: "<gold>REVENGE! You killed <yellow>{player}</yellow> who killed you!"
assist-notification: "<gray>Assist! You helped kill <yellow>{player}</yellow>."

# Kit
kit-created: "<green>Kit <yellow>{kit}</yellow> created."
kit-deleted: "<red>Kit <yellow>{kit}</yellow> deleted."
kit-not-found: "<red>Kit <yellow>{kit}</yellow> not found."
kit-equipped: "<green>Kit <yellow>{kit}</yellow> equipped."
kit-list-header: "<gold>--- Your Kits ({count}/{max}) ---"
kit-list-entry: " <gray>- <yellow>{kit} <dark_gray>({items} items)"
kit-slots-full: "<red>You've reached your kit limit ({max}). Delete a kit first."
kit-already-exists: "<red>You already have a kit named <yellow>{kit}</yellow>."
kit-share-sent: "<green>Kit share request sent to <yellow>{player}</yellow>."
kit-share-received: "<yellow>{sender}</yellow> wants to share kit <green>{kit}</green> with you. <yellow>[Accept]"
kit-share-accepted: "<green>Kit <yellow>{kit}</yellow> added to your kits."
kit-share-declined: "<red>Kit share request declined."
kit-share-expired: "<red>Kit share request from <yellow>{sender}</yellow> expired."
kit-preview-title: "Preview: {kit}"
kit-renamed: "<green>Kit <yellow>{old}</yellow> renamed to <yellow>{new}</yellow>."
kit-set-public: "<green>Kit <yellow>{kit}</yellow> is now public."
kit-set-private: "<yellow>Kit <yellow>{kit}</yellow> is now private."
kit-cooldown: "<red>This kit is on cooldown for <yellow>{seconds}</yellow>s."
kit-banned-item: "<red>Kit contains banned item(s): <yellow>{items}</yellow>. Removed."
kit-no-permission: "<red>You don't have permission to use kit <yellow>{kit}</yellow>."
kit-lobby-only: "<red>You can only equip kits in the arena lobby."
kit-admin-set-public: "<green>Admin kit <yellow>{kit}</yellow> set public."
kit-admin-set-private: "<yellow>Admin kit <yellow>{kit}</yellow> set private."
kit-icon-set: "<green>Icon set for kit <yellow>{kit}</yellow>."
kit-desc-set: "<green>Description set for kit <yellow>{kit}</yellow>."

# Sign
sign-created: "<green>Arena sign created for <yellow>{arena}</yellow>."
sign-removed: "<green>Arena sign removed."
sign-not-found: "<red>No arena sign found there."
sign-list-header: "<gold>--- Signs for {arena} ({count}) ---"
sign-list-entry: " <gray>- <white>{world}</white> <gray>{x}, {y}, {z}"
sign-target-block: "<red>Look at a block to place a sign."

# Spawn
spawn-set: "<green>Spawn <yellow>{type}</yellow> set for arena <yellow>{arena}</yellow>."
spawn-list-header: "<gold>--- Spawns: {arena} ---"
spawn-entry: " <gray>- <yellow>{type} <white>#{index}: <gray>{world} {x},{y},{z}"

# Region
region-first-point: "<yellow>First point set at <white>{x},{y},{z}</white>."
region-second-point: "<yellow>Second point set at <white>{x},{y},{z}</white>. Region saved."
region-set: "<green>Region for <yellow>{arena}</yellow> set."
region-not-set: "<red>No region defined for <yellow>{arena}</yellow>."

# Config
config-set: "<green>Set <yellow>{key}</yellow> = <white>{value}</white> in arena <yellow>{arena}</yellow>."
config-get: "<gray>{key}</gray>: <white>{value}"
config-invalid-key: "<red>Unknown config key: <yellow>{key}</yellow>."

# Stats
stats-header: "<gold>=== Stats: {player} ==="
stats-kills: " <gray>Kills: <white>{kills}"
stats-deaths: " <gray>Deaths: <white>{deaths}"
stats-wins: " <gray>Wins: <white>{wins}"
stats-losses: " <gray>Losses: <white>{losses}"
stats-kd: " <gray>K/D Ratio: <white>{kd}"
stats-time-played: " <gray>Time Played: <white>{time}"
stats-reset: "<green>Stats for <yellow>{player}</yellow> reset."
leaderboard-header: "<gold>=== Leaderboard: {type} ==="
leaderboard-entry: " <gray>{rank}. <yellow>{player} <white>{value}"

# Titles (match events — these are chat titles)
title-match-start: "<gold>FIGHT!"
title-match-start-sub: "<gray>Match started in <yellow>{arena}"
title-match-end-win: "<green>VICTORY!"
title-match-end-win-sub: "<gray>You won the match!"
title-match-end-lose: "<red>DEFEAT"
title-match-end-lose-sub: "<gray>Better luck next time."
title-match-end-draw: "<yellow>DRAW"
title-match-end-draw-sub: "<gray>Match ended in a draw."
title-countdown: "<yellow>{seconds}"
title-countdown-sub: ""
title-killstreak: "<gold>{streak}x KILLSTREAK"
title-killstreak-sub: "<yellow>{title}"
title-first-blood: "<dark_red>FIRST BLOOD"
title-first-blood-sub: "<red>{player} drew first blood!"

# Modules / Classes
class-selected: "<green>Class <yellow>{class}</yellow> selected."
class-not-found: "<red>Class <yellow>{class}</yellow> not found."
class-created: "<green>Class <yellow>{class}</yellow> created for arena <yellow>{arena}</yellow>."
module-enabled: "<green>Module <yellow>{module}</yellow> enabled for <yellow>{arena}</yellow>."
module-disabled: "<yellow>Module <yellow>{module}</yellow> disabled for <yellow>{arena}</yellow>."

# Regen / Reset
regen-started: "<yellow>Regenerating arena <yellow>{arena}</yellow>..."
regen-complete: "<green>Arena <yellow>{arena}</yellow> regenerated."
regen-failed: "<red>Regen failed for <yellow>{arena}</yellow>. Check console."

# Force win
forcewin-player: "<gold>Victory awarded to <yellow>{player}</yellow> in <yellow>{arena}</yellow>."
forcewin-team: "<gold>Victory awarded to team <yellow>{team}</yellow> in <yellow>{arena}</yellow>."

# Economy
reward-kill: "<green>+${amount} for kill."
reward-win: "<green>+${amount} for winning!"

# Goals
goal-set: "<green>Win condition set to <yellow>{goal}</yellow> for <yellow>{arena}</yellow>."
goal-value-set: "<green>Goal value set to <yellow>{value}</yellow>."

# Boss bar templates
bossbar-timer: "Time Remaining: {time}"
bossbar-health: "Team Health: {health}"
bossbar-objective: "Objective: {status}"

# Action bar templates
actionbar-combo: "Combo: x{combo}"
actionbar-objective: "{objective}"
actionbar-spawn-protection: "Spawn Protection: {seconds}s"
