# OmniArena Messages Configuration
# Supports MiniMessage format: https://docs.advntr.dev/minimessage/format.html

prefix: "<dark_gray>[<gradient:#ff6b35:#f7c59f>OmniArena</gradient><dark_gray>] "

# General
no-permission: "<red>You don't have permission to do that. <gray>Ask an admin to grant you the permission node for this command."
player-only: "<red>This command can only be used by a player in-game, not from the console. <gray>Join the server and run it there."
plugin-stopped: "<red>OmniArena is currently stopped, so commands are disabled."
unknown-command: "<red>Unknown command <yellow>{input}</yellow>. <gray>Type {help} <gray>to see what you can do."
invalid-args: "<red>Wrong arguments. <gray>Correct usage: <yellow>{usage}</yellow>"
player-not-found: "<red>Player <yellow>{player}</yellow> is not online or the name is misspelled. <gray>Names are exact; use tab-complete."
arena-not-found: "<red>Arena <yellow>{arena}</yellow> not found. <gray>See arenas with <white>/oa list</white>; admins can create one with <white>/oa setup {arena}</white>."
invalid-number: "<red><yellow>{input}</yellow> is not a valid number. <gray>Use digits only, e.g. <white>10</white> or <white>2.5</white>."
arena-not-whitelisted: "<red>This arena is whitelist-only and you are not on its whitelist. <gray>Ask an admin to add you, or pick another arena with <white>/oa join</white>."
arena-banned: "<red>You are banned from this arena, so you cannot join it. <gray>Ask an admin to lift the ban if this is a mistake."
config-reloaded: "<green>Configuration reloaded successfully."
plugin-version: "<gray>OmniArena <green>v{version} <gray>by OmniArena Team."

# Arena Management
arena-created: "<green>Arena <yellow>{arena}</yellow> created successfully."
arena-deleted: "<red>Arena <yellow>{arena}</yellow> deleted."
arena-enabled: "<green>Arena <yellow>{arena}</yellow> is now <green>enabled</green>."
arena-disabled: "<yellow>Arena <yellow>{arena}</yellow> is now <red>disabled</red>."
arena-list-header: "<gold>--- Arenas ({count}) ---"
arena-list-entry: " <gray>- <yellow>{arena} <dark_gray>| <gray>Mode: <white>{mode} <dark_gray>| <gray>Status: {status} <dark_gray>| <gray>Players: <white>{players}/{max}"
arena-info-header: "<gold>=== Arena: {arena} ==="
arena-info-mode: " <gray>Mode: <white>{mode}"
arena-info-status: " <gray>Status: {status}"
arena-info-players: " <gray>Players: <white>{players}/{max}"
arena-info-region: " <gray>Region: <white>{region}"
arena-info-spawns: " <gray>Spawns: <white>{spawns}"

# Match
match-starting: "<yellow>Match starting in <gold>{seconds}</gold> seconds!"
match-started: "<green>Match started! Good luck!"
match-ended: "<gold>Match over! {result}"
match-winner: "<gold>Winner: <yellow>{winner}"
match-draw: "<gray>The match ended in a draw."

# Join / Leave
join-arena: "<green>You joined arena <yellow>{arena}</yellow>!"
leave-arena: "<yellow>You left arena <yellow>{arena}</yellow>."
already-in-arena: "<red>You are already in an arena. <gray>Leave it first with <white>/oa leave</white>."
not-in-arena: "<red>You are not in an arena. <gray>Join one with <white>/oa join</white> (or <white>/oa join <arena></white>)."
arena-full: "<red>Arena <yellow>{arena}</yellow> is full ({max} players). <gray>Try another arena (<white>/oa join</white>) or spectate with <white>/oa spectate {arena}</white>."
arena-disabled-join: "<red>Arena <yellow>{arena}</yellow> is disabled, so nobody can join. <gray>Admins: enable it with <white>/oa arena enable {arena}</white>."
arena-in-progress: "<yellow>Arena <yellow>{arena}</yellow> is in progress. Join as spectator? <green>[Click]"
match-min-players: "<yellow>Waiting for players... <gray>({current}/{min} needed)"

# Spectator
spectate-joined: "<gray>You are now spectating <yellow>{arena}</yellow>."
spectate-left: "<gray>You left spectator mode."
spectate-not-allowed: "<red>You can't spectate <yellow>{arena}</yellow> right now: spectating is disabled for it, or it has no running match. <gray>Check <white>/oa list {arena}</white>; admins can set a spectator spawn with <white>/oa setup {arena} spectator</white>."
spectate-follow: "<gray>Following <yellow>{player}</yellow>. Sneak to stop."

# Kill / Death
kill-announcement: "<red>{killer} <dark_gray>[<red>{killer_kills}<dark_gray>] <gray>killed <yellow>{victim} <gray>with <white>{weapon}<gray>."
death-message: "<red>You were killed by <yellow>{killer}</yellow>."
eliminated: "<red>You were eliminated! <gray>Spectating until the round ends."

# ── PvP / Combat ──
combat-tagged: "<red>⚔ You are now in combat! <gray>Don't log out."
combat-untagged: "<green>You are no longer in combat."
combat-expired: "<green>⚔ You are out of combat."
combat-log: "<dark_red>{player} logged out in combat and was slain!"
combat-no-command: "<red>You can't use that command while in combat."
combat-no-teleport: "<red>You can't teleport while in combat."
combat-no-place: "<red>You can't place blocks while in combat."
combat-no-safezone: "<red>You can't enter a safe zone while in combat!"
combat-no-lavafire: "<red>You can't place lava or fire near a protected player."
pvp-global-off: "<red>PvP is disabled on this server."
pvp-world-off: "<red>PvP is disabled in this world."
pvp-newbie-victim: "<red>That player is under newbie protection."
pvp-respawn-protected: "<red>That player just respawned and is protected."
pvp-newbie-self: "<red>You are protected — attack to give up protection."
pvp-victim-disabled: "<red>That player has PvP disabled."
pvp-self-disabled: "<red>You have PvP disabled. Use /pvp to enable it."
pvp-enabled-self: "<green>Your PvP is now <bold>ON</bold>."
pvp-disabled-self: "<yellow>Your PvP is now <bold>OFF</bold>."
pvp-global-on-broadcast: "<green>PvP has been enabled server-wide."
pvp-global-off-broadcast: "<red>PvP has been disabled server-wide."
newbie-granted: "<aqua>Welcome! You have newbie protection. <gray>Attack anyone to give it up."
newbie-disabled: "<yellow>Newbie protection disabled."
first-blood: "<dark_red>FIRST BLOOD! <yellow>{killer}</yellow> drew first blood on <yellow>{victim}</yellow>!"
killstreak-self: "<gold>KILLSTREAK x{streak}! {title}"
killstreak-broadcast: "<yellow>{player}</yellow> is on a <gold>{streak} killstreak</gold>! ({title})"
killstreak-broken: "<green>You broke <yellow>{player}'s</yellow> <gold>{streak}</gold> killstreak!"
combo-counter: "<gold>x{combo} COMBO!"
revenge-kill: "<gold>REVENGE! You killed <yellow>{player}</yellow> who killed you!"
assist-notification: "<gray>Assist! You helped kill <yellow>{player}</yellow>."

# Kit
kit-created: "<green>Kit <yellow>{kit}</yellow> created."
kit-deleted: "<red>Kit <yellow>{kit}</yellow> deleted."
kit-not-found: "<red>Kit <yellow>{kit}</yellow> not found. <gray>See your kits with <white>/kit list</white> (admin presets: <white>/oa kits list</white>)."
kit-equipped: "<green>Kit <yellow>{kit}</yellow> equipped."
kit-list-header: "<gold>--- Your Kits ({count}/{max}) ---"
kit-list-entry: " <gray>- <yellow>{kit} <dark_gray>({items} items)"
kit-slots-full: "<red>You've reached your kit limit ({max}). <gray>Delete one with <white>/kit delete <name></white> or ask an admin for more slots (permission <white>omniarena.kit.slots.<n></white>)."
kit-already-exists: "<red>You already have a kit named <yellow>{kit}</yellow>. <gray>Choose another name or delete it with <white>/kit delete {kit}</white>."
kit-share-sent: "<green>Kit share request sent to <yellow>{player}</yellow>."
kit-share-received: "<yellow>{sender}</yellow> wants to share kit <green>{kit}</green> with you. <yellow>[Accept]"
kit-share-accepted: "<green>Kit <yellow>{kit}</yellow> added to your kits."
kit-share-declined: "<red>Kit share request declined."
kit-share-expired: "<red>Kit share request from <yellow>{sender}</yellow> expired."
kit-preview-title: "Preview: {kit}"
kit-renamed: "<green>Kit <yellow>{old}</yellow> renamed to <yellow>{new}</yellow>."
kit-set-public: "<green>Kit <yellow>{kit}</yellow> is now public."
kit-set-private: "<yellow>Kit <yellow>{kit}</yellow> is now private."
kit-cooldown: "<red>This kit is on cooldown for <yellow>{seconds}</yellow>s. <gray>Try again after the timer ends."
kit-banned-item: "<red>Kit contains banned item(s): <yellow>{items}</yellow>. <gray>They were removed; edit <white>kits.power-cap.banned-items</white> in config.yml to allow them."
kit-no-permission: "<red>You don't have permission to use kit <yellow>{kit}</yellow>. <gray>Ask an admin for the permission node set with <white>/oa kits permission {kit} <node></white>."
kit-lobby-only: "<red>You can only equip kits in the arena lobby. <gray>Join an arena with <white>/oa join</white> and equip while waiting."
kit-admin-set-public: "<green>Admin kit <yellow>{kit}</yellow> set public."
kit-admin-set-private: "<yellow>Admin kit <yellow>{kit}</yellow> set private."
kit-icon-set: "<green>Icon set for kit <yellow>{kit}</yellow>."
kit-desc-set: "<green>Description set for kit <yellow>{kit}</yellow>."

# Sign
sign-created: "<green>Arena sign created for <yellow>{arena}</yellow>."
sign-removed: "<green>Arena sign removed."
sign-not-found: "<red>No arena sign found at the block you are looking at. <gray>Look directly at a sign created with <white>/oa sign create <arena></white>."
sign-list-header: "<gold>--- Signs for {arena} ({count}) ---"
sign-list-entry: " <gray>- <white>{world}</white> <gray>{x}, {y}, {z}"
sign-target-block: "<red>You are not looking at a block (or it is too far away, max 5 blocks). <gray>Aim at the block where the sign should go and retry."

# Region
region-first-point: "<yellow>First point set at <white>{x},{y},{z}</white>."
region-second-point: "<yellow>Second point set at <white>{x},{y},{z}</white>. Region saved."
region-set: "<green>Region for <yellow>{arena}</yellow> set."
region-not-set: "<red>No region defined for <yellow>{arena}</yellow>. <gray>Select two corners with the wand (<white>/oa setup {arena}</white>), then run <white>/oa setup {arena} region</white>."

# Config
config-set: "<green>Set <yellow>{key}</yellow> = <white>{value}</white> in arena <yellow>{arena}</yellow>."
config-get: "<gray>{key}</gray>: <white>{value}"
config-invalid-key: "<red>Unknown setting <yellow>{key}</yellow>. <gray>Press TAB after <white>/oa edit <arena> set</white> to see valid keys."

# Stats
stats-header: "<gold>=== Stats: {player} ==="
stats-kills: " <gray>Kills: <white>{kills}"
stats-deaths: " <gray>Deaths: <white>{deaths}"
stats-wins: " <gray>Wins: <white>{wins}"
stats-losses: " <gray>Losses: <white>{losses}"
stats-kd: " <gray>K/D Ratio: <white>{kd}"
stats-time-played: " <gray>Time Played: <white>{time}"
stats-reset: "<green>Stats for <yellow>{player}</yellow> reset."
leaderboard-header: "<gold>=== Leaderboard: {type} ==="
leaderboard-entry: " <gray>{rank}. <yellow>{player} <white>{value}"

# Titles (match events — these are chat titles)
title-match-start: "<gold>FIGHT!"
title-match-start-sub: "<gray>Match started in <yellow>{arena}"
title-match-end-win: "<green>VICTORY!"
title-match-end-win-sub: "<gray>You won the match!"
title-match-end-lose: "<red>DEFEAT"
title-match-end-lose-sub: "<gray>Better luck next time."
title-match-end-draw: "<yellow>DRAW"
title-match-end-draw-sub: "<gray>Match ended in a draw."
title-countdown: "<yellow>{seconds}"
title-countdown-sub: ""
title-killstreak: "<gold>{streak}x KILLSTREAK"
title-killstreak-sub: "<yellow>{title}"
title-first-blood: "<dark_red>FIRST BLOOD"
title-first-blood-sub: "<red>{player} drew first blood!"

# Modules / Classes
class-selected: "<green>Class <yellow>{class}</yellow> selected."
class-not-found: "<red>Class <yellow>{class}</yellow> not found. <gray>Check the spelling."
class-created: "<green>Class <yellow>{class}</yellow> created for arena <yellow>{arena}</yellow>."

# Regen / Reset
regen-started: "<yellow>Regenerating arena <yellow>{arena}</yellow>..."
regen-complete: "<green>Arena <yellow>{arena}</yellow> regenerated."
regen-failed: "<red>Regen failed for <yellow>{arena}</yellow>. <gray>Check the server console for the exact reason; usually no snapshot exists yet: run <white>/oa regen snapshot {arena}</white> first."

# Economy
reward-kill: "<green>+${amount} for kill."
reward-win: "<green>+${amount} for winning!"

# Tournament
tournament-no-permission: "<red>You can't manage this tournament: only its creator or admins (<white>omniarena.tournament.admin</white>) can."
tournament-not-found: "<red>Tournament <yellow>{name}</yellow> not found. <gray>See active ones with <white>/tournament list</white>."
tournament-none: "<gray>No active tournaments."
tournament-list-header: "<gold>=== Active Tournaments ==="
tournament-list-entry: "<yellow>{name} <gray>[{state}] {players}/{max} on {arena}"
tournament-prize-set: "<green>Set {place} prize of <yellow>{amount}</yellow> for <yellow>{name}</yellow>."
tournament-prize-invalid: "<red>Invalid prize. <gray>Usage: <white>/tournament setprize <name> <1st|2nd|3rd> <amount></white> where amount is a number of 0 or more."
tournament-players-only: "<red>This tournament action needs a player (it uses your position/identity). <gray>Run it in-game, or use <white>/tournament list|status <name></white> from console."

# Boss bar templates
bossbar-timer: "Time Remaining: {time}"
bossbar-health: "Team Health: {health}"
bossbar-objective: "Objective: {status}"

# Action bar templates
actionbar-combo: "Combo: x{combo}"
actionbar-objective: "{objective}"
actionbar-spawn-protection: "Spawn Protection: {seconds}s"

# ── Detailed errors (what failed / why / how to fix) ──
usage-line: "<red>Usage: <yellow>{usage}"
error-internal: "<red>Something went wrong while running <yellow>{command}</yellow>. <gray>This is a plugin problem, not your fault: ask an admin to check the server console for the full error."
arena-no-spawns: "<red>Arena <yellow>{arena}</yellow> has no {type} spawns. <gray>Stand where players should appear and run <white>/oa setup {arena} spawn</white>."
arena-no-region: "<red>Arena <yellow>{arena}</yellow> has no region. <gray>Select corners with the wand (<white>/oa setup {arena}</white>) and run <white>/oa setup {arena} region</white>."
invalid-name: "<red>Invalid name <yellow>{input}</yellow>. <gray>Use only letters, numbers, '_', '-' and '.' (max 32 characters), e.g. <white>my_kit</white>."
invalid-material: "<red>Unknown item/material <yellow>{input}</yellow>. <gray>Use a Minecraft item id like <white>DIAMOND_SWORD</white>; press TAB to see valid ones."
negative-number: "<red><yellow>{input}</yellow> must be 0 or higher. <gray>Use a non-negative number such as <white>0</white> or <white>30</white>."
world-not-found: "<red>World <yellow>{world}</yellow> does not exist or is not loaded. <gray>Check the name with <white>/mvlist</white> or your world folder names (case-sensitive)."
economy-missing: "<red>Betting is unavailable because no economy plugin is connected. <gray>Admins: install <white>Vault</white> plus an economy plugin (e.g. EssentialsX), set <white>betting.enabled: true</white> in config.yml, then restart the server."
bet-player-not-in-arena: "<red><yellow>{player}</yellow> is not playing in arena <yellow>{arena}</yellow>, so you cannot bet on them. <gray>Pick someone who is in the match (<white>/oa list {arena}</white> shows the arena)."

# ── Smart errors (did-you-mean, clickable fixes) ──
unknown-command-suggest: "<red>Unknown command <yellow>{input}</yellow>. <gray>Did you mean {suggestion}<gray>? (click to use it)"
wrong-args: "<red>Wrong arguments. <gray>Usage: <yellow>{usage}</yellow>"
wrong-args-example: " <gray>Example: {example}"
arena-none: "<red>There is no arena called <yellow>{input}</yellow> (no arenas exist yet). <gray>Admins can create one with {setup}<gray>."
arena-unknown: "<red>No arena named <yellow>{input}</yellow>."
arena-unknown-suggest: "<red>No arena named <yellow>{input}</yellow>. <gray>Did you mean {suggestion}<gray>?"
arena-unknown-list: " <gray>Arenas: {list}"
arena-not-ready: "<red>You can't join <yellow>{arena}</yellow> right now:"
arena-not-ready-line: " <gray>- {reason}"
arena-not-ready-list: " <gray>See what is open: {list}"

# Self-healing (/oa doctor). Placeholders: {title} {text} {command} {count}
doctor-header: "<gold><bold>=== OmniArena Doctor ==="
doctor-section: "<yellow>{title}"
doctor-ok: "  <green>\u2713 {text}"
doctor-problem: "  <red>\u2717 <white>{text}"
doctor-info: "  <gray>{text}"
doctor-fix: " <click:run_command:'{command}'><hover:show_text:'<gray>Click to run <white>{command}'><aqua>[fix]</aqua></hover></click>"
doctor-footer-ok: "<green>No problems found."
doctor-footer-problems: "<red>{count} problem(s) found. <click:run_command:'{command}'><hover:show_text:'<gray>Run the watchdog fixes now'><aqua>[/oa doctor fix]</aqua></hover></click>"
doctor-fix-none: "<green>Nothing needed fixing."
doctor-fix-done: "<green>Fixed {count} problem(s):"
doctor-stopped: "<red>OmniArena is stopped, so the watchdog cannot fix anything. <gray>Use <yellow>/oa plugin start</yellow> first."
health-admin-notice: "<yellow>OmniArena fixed {count} problem(s) since the last restart. <click:run_command:'/oa doctor'><hover:show_text:'<gray>Open the health report'><aqua>[/oa doctor]</aqua></hover></click>"

# ── Worlds, plugin API, leaderboards and NPCs ──
arena-world-missing: "<red>Arena world '<yellow>{world}</yellow>' is not loaded."
arena-world-missing-hint: " <gray>The arena keeps all its data and becomes available as soon as the world loads. Load it (Multiverse: <white>/mv load {world}</white>) or check the world folder name."
arena-world-loaded: "<green>The world of arena <yellow>{arena}</yellow> is loaded; the arena is available again."
join-cancelled: "<red>Joining was blocked by another plugin."
leaderboard-no-hook: "<red>No hologram plugin is available. <gray>Install <white>DecentHolograms</white> or <white>FancyHolograms</white> (and keep <white>integrations.decentholograms</white> / <white>integrations.fancyholograms</white> true), or use the placeholders <white>%omniarena_top_kills_1_name%</white> / <white>%omniarena_top_kills_1_value%</white> in any hologram plugin together with PlaceholderAPI."
leaderboard-created: "<green>Leaderboard <yellow>{id}</yellow> (<white>{metric}</white>, top {size}) created in {hook} at your position."
leaderboard-static-note: "<gray>PlaceholderAPI is not installed, so the lines show static values that OmniArena refreshes every 60 seconds."
leaderboard-removed: "<green>Leaderboard <yellow>{id}</yellow> removed."
leaderboard-not-found: "<red>No leaderboard called <yellow>{id}</yellow>. <gray>See {list}<gray>."
leaderboard-exists: "<red>A leaderboard called <yellow>{id}</yellow> already exists. <gray>Pick another id or remove it first with <white>/oa leaderboard remove {id}</white>."
leaderboard-invalid-id: "<red>Invalid id <yellow>{id}</yellow>. <gray>Use 1-32 letters, numbers, '_' or '-'."
leaderboard-failed: "<red>The hologram plugin refused the leaderboard (it may already have a hologram with that name). <gray>See the server console for details, then try another id."
leaderboard-list-empty: "<yellow>No leaderboards yet. <gray>Create one with {create}<gray>."
leaderboard-list-header: "<gold>Leaderboards ({count}):"
leaderboard-list-line: " <yellow>{id}</yellow> <gray>- {metric} top {size} in {hook} at {pos}"
npc-no-citizens: "<red>Citizens is not available. <gray>Install the <white>Citizens</white> plugin (and keep <white>integrations.citizens</white> true), then run <white>/oa reload</white>."
npc-unknown-kit: "<red>No queue kit named <yellow>{kit}</yellow>. <gray>Available: {kits}"
npc-created: "<green>NPC <yellow>#{id}</yellow> created: right-click runs <white>{action}{arg}</white>. <gray>Move or rename it with the normal Citizens commands (<white>/npc</white>)."
npc-failed: "<red>Citizens could not create the NPC. <gray>See the server console for the error."
npc-removed: "<green>NPC <yellow>#{id}</yellow> removed."
npc-not-found: "<red>No OmniArena NPC with id <yellow>{id}</yellow>. <gray>See {list}<gray>."
npc-list-empty: "<yellow>No OmniArena NPCs yet. <gray>Create one with {create}<gray>."
npc-list-header: "<gold>OmniArena NPCs ({count}):"
npc-list-line: " <yellow>#{id}</yellow> <gray>- {action}{arg} ({state}<gray>)"
