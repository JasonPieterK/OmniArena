name: OmniArena
version: '${project.version}'
main: com.omniarena.OmniArena
api-version: '${api.version}'
description: Complete PVP Arena Plugin with 200+ features
authors: [OmniArena Team]
website: https://omniarena.dev
load: POSTWORLD
depend: []
softdepend:
  - Vault
  - PlaceholderAPI
  - WorldGuard
  - WorldEdit
  - FastAsyncWorldEdit
  - LuckPerms
  - PermissionsEx
  - EssentialsX
  - DiscordSRV
  - HolographicDisplays
  - LibsDisguises

commands:
  oa:
    description: OmniArena main command
    usage: /oa <subcommand> [args]
    aliases: [omniarena, arena]
    permission: omniarena.use
  kit:
    description: Player kit management
    usage: /kit <subcommand> [args]
    permission: omniarena.kit.use
  join:
    description: Join an arena
    usage: /join <arena>
    permission: omniarena.use
  leave:
    description: Leave current arena
    usage: /leave
    permission: omniarena.use
  party:
    description: Party management
    usage: /party <subcommand> [args]
    permission: omniarena.use
  spectate:
    description: Spectate an arena
    usage: /spectate <arena>
    permission: omniarena.spectate
  stats:
    description: View your statistics
    usage: /stats
    permission: omniarena.use
  list:
    description: List available arenas
    usage: /list
    permission: omniarena.use
  info:
    description: Get arena information
    usage: /info <arena>
    permission: omniarena.use
  ready:
    description: Mark yourself ready for match
    usage: /ready
    permission: omniarena.use
  help:
    description: Get OmniArena help
    usage: /help [guide]
    permission: omniarena.use
  bet:
    description: Bet on arena match outcomes (same as /oa bet)
    usage: /bet <place|cancel|info> [arena] [player] [amount]
    permission: omniarena.bet
  tournament:
    description: Create and play bracket tournaments (same as /oa tournament)
    usage: /tournament <create|join|leave|start|status|list|delete|setprize> [args]
    permission: omniarena.use
  pvp:
    description: Toggle PvP status
    usage: /pvp [player]
    permission: omniarena.pvp
  pvpstatus:
    description: Check PvP status
    usage: /pvpstatus [player]
    permission: omniarena.pvp
  pvptag:
    description: Tag player for PvP
    usage: /pvptag [player] [seconds]
    permission: omniarena.pvp.admin
  untag:
    description: Remove PvP tag from player
    usage: /untag [player]
    permission: omniarena.pvp.admin
  pvpglobal:
    description: Toggle global PvP
    usage: /pvpglobal <on|off>
    permission: omniarena.pvp.admin
  newbie:
    description: Newbie protection management
    usage: /newbie <add|remove|checktime|disable> [player]
    permission: omniarena.pvp

permissions:
  omniarena.use:
    description: Access to basic OmniArena player commands
    default: true

  omniarena.kit.use:
    description: Access to /kit player commands
    default: true

  omniarena.queue:
    description: Use /oa queue (ranked matchmaking queue)
    default: true

  omniarena.bet:
    description: Place and manage bets on arena matches
    default: true

  omniarena.admin:
    description: Full OmniArena admin access
    default: op
    children:
      omniarena.admin.arena: true
      omniarena.admin.kit: true
      omniarena.admin.match: true
      omniarena.admin.sign: true
      omniarena.admin.hologram: true
      omniarena.admin.stats: true
      omniarena.admin.reload: true
      omniarena.admin.override: true
      omniarena.admin.access: true
      omniarena.admin.doctor: true
      omniarena.pvp.admin: true
      omniarena.tournament.admin: true
      omniarena.join.bypass: true

  omniarena.admin.arena:
    description: Arena create/delete/config
    default: op

  omniarena.admin.kit:
    description: Admin kit management
    default: op

  omniarena.admin.match:
    description: Force start/stop/win matches
    default: op

  omniarena.admin.sign:
    description: Create/remove arena signs
    default: op

  omniarena.admin.hologram:
    description: Create/remove/move leaderboard holograms
    default: op

  omniarena.admin.stats:
    description: Reset/view all player stats
    default: op

  omniarena.admin.override:
    description: Powerful admin overrides (/oa override ...)
    default: op

  omniarena.admin.reload:
    description: Reload plugin config
    default: op

  omniarena.admin.access:
    description: Manage per-arena whitelist/blacklist (/oa access)
    default: op

  omniarena.admin.doctor:
    description: Health report and self-healing (/oa doctor)
    default: op

  omniarena.kit.slots.5:
    description: Allow player to save 5 personal kits
    default: false

  omniarena.kit.slots.10:
    description: Allow player to save 10 personal kits
    default: false

  omniarena.spectate:
    description: Spectate arenas
    default: true

  omniarena.tournament.create:
    description: Create, join, leave and start own tournaments
    default: true

  omniarena.tournament.admin:
    description: Manage any tournament (start, delete, setprize)
    default: op

  omniarena.pvp:
    description: Use player PvP/combat commands (/oa pvp, pvpstatus, newbie...)
    default: true

  omniarena.pvp.admin:
    description: Admin PvP commands (tag, untag, global, override, force-toggle others)
    default: op

  omniarena.join.bypass:
    description: Bypass arena full/whitelist checks
    default: op
