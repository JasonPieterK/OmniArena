name: OmniArena
version: '${project.version}'
main: com.omniarena.OmniArena
api-version: '${api.version}'
description: Complete PVP Arena Plugin with 200+ features
authors: [OmniArena Team]
website: https://omniarena.dev
load: POSTWORLD
depend: []
softdepend:
  - Vault
  - PlaceholderAPI
  - WorldGuard
  - WorldEdit
  - FastAsyncWorldEdit
  - LuckPerms
  - PermissionsEx
  - EssentialsX
  - DiscordSRV
  - DecentHolograms
  - FancyHolograms
  - Citizens
  - Multiverse-Core
  - LibsDisguises

commands:
  oa:
    description: OmniArena main command
    usage: /oa [subcommand] [args] (no arguments opens the menu)
    aliases: [omniarena, arena]
    permission: omniarena.use
  kit:
    description: Player kit management
    usage: /kit <subcommand> [args]
    permission: omniarena.kit.use
  join:
    description: Join an arena
    usage: /join [arena]
    permission: omniarena.use
  leave:
    description: Leave current arena
    usage: /leave
    permission: omniarena.use
  party:
    description: Party management
    usage: /party <subcommand> [args]
    permission: omniarena.use
  spectate:
    description: Spectate an arena
    usage: /spectate [arena]
    permission: omniarena.spectate
  bet:
    description: Bet on arena match outcomes (same as /oa bet)
    usage: /bet <place|cancel|info> [arena] [player] [amount]
    permission: omniarena.bet
  tournament:
    description: Create and play bracket tournaments (same as /oa tournament)
    usage: /tournament <create|join|leave|start|status|list|delete|setprize> [args]
    permission: omniarena.use
  pvp:
    description: Toggle PvP, check status and newbie protection
    usage: /pvp [status|newbie|tag|untag|global|list]
    permission: omniarena.pvp

permissions:
  omniarena.use:
    description: Access to basic OmniArena player commands
    default: true

  omniarena.kit.use:
    description: Access to /kit player commands
    default: true

  omniarena.queue:
    description: Use /oa queue (ranked matchmaking queue)
    default: true

  omniarena.bet:
    description: Place and manage bets on arena matches
    default: true

  omniarena.admin:
    description: Full OmniArena admin access
    default: op
    children:
      omniarena.admin.arena: true
      omniarena.admin.kit: true
      omniarena.admin.sign: true
      omniarena.admin.leaderboard: true
      omniarena.admin.npc: true
      omniarena.admin.stats: true
      omniarena.admin.reload: true
      omniarena.admin.access: true
      omniarena.pvp.admin: true
      omniarena.tournament.admin: true
      omniarena.join.bypass: true

  omniarena.admin.arena:
    description: Arena setup, edit, enable/disable, delete, regen
    default: op

  omniarena.admin.kit:
    description: Admin kit management
    default: op

  omniarena.admin.sign:
    description: Create/remove arena signs
    default: op

  omniarena.admin.leaderboard:
    description: Create/remove leaderboard holograms (/oa leaderboard)
    default: op

  omniarena.admin.npc:
    description: Create/remove Citizens NPCs bound to menus, join, queue, spectate (/oa npc)
    default: op

  omniarena.admin.stats:
    description: Reset/view all player stats
    default: op

  omniarena.admin.reload:
    description: Reload plugin config
    default: op

  omniarena.admin.access:
    description: Manage per-arena whitelist/blacklist (/oa edit <arena> whitelist|blacklist)
    default: op

  omniarena.kit.slots.5:
    description: Allow player to save 5 personal kits
    default: false

  omniarena.kit.slots.10:
    description: Allow player to save 10 personal kits
    default: false

  omniarena.spectate:
    description: Spectate arenas
    default: true

  omniarena.tournament.create:
    description: Create, join, leave and start own tournaments
    default: true

  omniarena.tournament.admin:
    description: Manage any tournament (start, delete, setprize)
    default: op

  omniarena.pvp:
    description: Use player PvP/combat commands (/pvp, /pvp status, /pvp newbie)
    default: true

  omniarena.pvp.admin:
    description: Admin PvP commands (/pvp tag, untag, global, list, override; view others)
    default: op

  omniarena.join.bypass:
    description: Bypass arena full/whitelist checks
    default: op
