# Example arena configuration
# Copy to arenas/<name>.yml and customise
name: example
enabled: false
game-mode: DEATHMATCH
min-players: 2
max-players: 16
match-duration: 300
countdown: 10
goal:
  type: KILLS
  value: 20  # first to 20 kills wins
respawn:
  delay: 3
  type: INSTANT  # INSTANT, DELAYED, WAVE
spawn-protection: 3
# Lives per player (0-100). 0 = not configured: the game mode's own respawn rules apply.
# With lives > 0: a player respawns while lives remain and is eliminated (spectator) at 0;
# the last player/team with lives left wins. Shown on the scoreboard. Set via /oa edit <arena> set lives <n>.
lives: 0
# Ranked queue note: /oa queue join queues you (or your whole party, when you lead it) for this pool.
# Parties of 2+ need an arena with team.enabled: true, team.count: 2 and max-players >= 2x party size.
rules:
  fall-damage: true
  fire-damage: true
  drowning: true
  suffocation: true
  friendly-fire: false
  block-break: false
  block-place: false
  item-drop: false
  hunger-drain: false
team:
  enabled: false
  count: 2
  colors: [RED, BLUE]
modules:
  enabled: [killstreak, combo]  # also: power-up
classes:
  enabled: false
  items: []
region:
  world: ""
  min-x: 0
  min-y: 0
  min-z: 0
  max-x: 0
  max-y: 0
  max-z: 0
spawns:
  battle: []
  lobby: []
  spectator: []
signs: []
mid-match-join: false
spectator-allowed: true
chat-mode: ARENA  # ARENA, TEAM, GLOBAL
announcements: true
end-commands: []
visual:
  titles: true
  sounds: true
  particles: true
  scoreboard: true
  boss-bar: true
  action-bar: true
  holograms: false
