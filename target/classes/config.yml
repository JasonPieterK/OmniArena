# OmniArena Global Configuration
# Changes take effect on /oa reload (no restart required)

plugin:
  debug: false
  language: en
  metrics: true  # bStats telemetry (disable: false)

tools:
  wand-material: WOODEN_HOE  # item used as the region selection wand

database:
  enabled: false
  type: YAML  # YAML or MYSQL
  mysql:
    host: localhost
    port: 3306
    database: omniarena
    username: root
    password: changeme
    pool-size: 10
    connection-timeout: 30000

arena:
  default-min-players: 2
  default-max-players: 16
  default-countdown: 10
  default-match-duration: 600  # seconds
  default-game-mode: DEATHMATCH
  lobby-timeout: 120  # seconds waiting for players before abort
  spectator-allowed: true
  mid-match-join: false
  respawn-delay: 3  # seconds
  spawn-protection: 3  # seconds of invulnerability on spawn
  inventory-restore: true  # restore player gear on leave
  teleport-back-on-leave: true
  region-protection: true  # prevent block damage outside match

match:
  end-commands: []  # Commands run on match end. Use {winner}, {loser}, {arena}, {mode}
  # Example:
  # - "give {winner} diamond 1"
  # - "broadcast {winner} won in {arena}!"
  end-delay: 5  # seconds before match resets after end
  announce-global: false  # broadcast match results to whole server
  announce-arena: true

regen:
  batch-size: 4000  # blocks restored per tick; higher = faster, lower = smoother
  progress:
    enabled: true
    interval-percent: 10  # chat progress updates every N percent
  animation:
    type: CENTER_OUT  # SPIRAL, OUTSIDE_IN, CENTER_OUT, TOP_TO_BOTTOM, BOTTOM_TO_TOP, LASER_RAIN, IRON_MAN, RANDOM_BURST, INSTANT, BEAM_SWEEP, SHOCKWAVE, CRYSTAL_GROWTH, VORTEX_REBUILD, METEOR_DROP, PRISM_WAVE
    particles: true
    sound: true

# ── PvP / Combat management (PvPManager-style, server-wide) ──
pvp:
  enabled: true
  combat:
    tag-duration: 15          # seconds you stay "in combat" after a hit
    tag-on-damage: true
    tag-on-attack: true
    cancel-teleport: true     # block /tp-style teleports while tagged
    block-commands: true      # block commands while tagged (except allowed list)
    allowed-commands:
      - /oa
      - /pvp
      - /pvpstatus
      - /pvptag
      - /msg
      - /r
      - /helpop
    block-enderpearls: true
    block-block-place: true
    disable-fly: true         # drop flight the moment combat starts
    disable-gamemode: true    # force survival on combat
    disable-invisibility: true # strip invisibility potion on combat
    disable-disguise: true    # undisguise (LibsDisguises) on combat
    punish-combat-log: true
    combat-log-action: KILL   # KILL, COMMAND, or NOTHING
    combat-log-commands: []   # used when action is COMMAND; {player} replaced
    drop-on-combat-log: true
    broadcast-combat-log: true
  toggle:
    enabled: true
    cooldown: 5               # seconds between /pvp toggles
    default-state: true       # PvP on by default for new players
  global:
    pvp-enabled: true         # server-wide master PvP switch
  newbie:
    enabled: true
    duration: 300             # seconds of protection for new players
    disable-on-attack: true   # protection drops if a newbie attacks someone
    block-pickup: false
  killabuse:
    enabled: true
    max-kills: 3              # kills on the same victim before it stops counting
    time-window: 300         # seconds the kill window spans
    cooldown: 600
  respawn-protection:
    enabled: true
    duration: 5              # seconds of invulnerability after respawn
  border-hopping:
    prevent: true            # tagged players can't flee into safe zones
  auto-soup:
    enabled: false
    heal-amount: 3.5         # half-hearts healed per soup
    soup-material: MUSHROOM_STEW
  blood:
    enabled: true
    block: REDSTONE_BLOCK    # block-break particle used for the blood splash
  transfer-drops: false      # send a victim's drops straight to their killer
  block-lava-fire-near-disabled: true
  lava-fire-radius: 5.0      # block lava/fire placement within this many blocks of a protected player
  disabled-worlds: []        # worlds where PvP is fully off

rewards:
  enabled: false
  kill-money: 10.0
  win-money: 50.0
  kill-xp: 5
  win-xp: 20

kits:
  player-kits-enabled: true
  default-slot-limit: 3  # personal kit slots per player
  power-cap:
    enabled: true
    max-enchant-level: 5
    banned-items:
      - BEDROCK
      - COMMAND_BLOCK
      - BARRIER
      - SPAWNER
  sharing-enabled: true

signs:
  glow-effect: true  # place glowstone behind arena signs
  update-interval: 20  # ticks between sign refreshes

visual:
  titles: true
  sounds: true
  particles: true
  scoreboard: true
  boss-bar: true
  action-bar: true
  holograms: true
  damage-indicators: true
  killstreak-titles: true
  kill-announcements: true
  team-colors: true
  victory-fireworks: true
  countdown-sounds: true
  spectator-invisibility: true

killstreak:
  milestones:
    5: "KILLING SPREE"
    10: "DOMINATING"
    15: "UNSTOPPABLE"
    20: "GODLIKE"
  sound: ENTITY_LIGHTNING_BOLT_THUNDER
  particle: FLAME

scoreboard:
  title: "<gradient:#ff6b35:#f7c59f>OmniArena</gradient>"
  update-interval: 10  # ticks

boss-bar:
  timer-color: GREEN
  low-time-color: RED  # color when < 60s remain
  low-time-threshold: 60

integrations:
  vault: true
  placeholderapi: true
  worldguard: true
  luckperms: true
  discordsrv: false
  discordsrv-channel: "arena-results"
  tab:
    # TAB (https://modrinth.com/plugin/tab-was-taken) compatibility.
    # When takeover is true, OmniArena stops drawing its own sidebar + bossbar
    # so TAB can render them from our PlaceholderAPI placeholders instead.
    # Placeholders: %omniarena_gamemode_name%, %omniarena_state%, %omniarena_arena%,
    #   %omniarena_arena_kills%, %omniarena_alive%, %omniarena_players%,
    #   %omniarena_time_left%, %omniarena_team%, %omniarena_team_color% (+ lifetime stats)
    takeover: false

anticheat:
  whitelist-arenas: true  # notify anticheat plugins during matches
  notify-plugins:
    - NoCheatPlus
    - Matrix
    - Grim

performance:
  async-stats-save: true
  async-region-check: true
  region-check-interval: 5  # ticks
  hologram-update-interval: 40  # ticks

web:
  enabled: true
  bind-address: 0.0.0.0
  port: 8123
  public-url: ""  # optional base URL for generated editor links
  session-minutes: 30
  max-sessions: 1
  title: OmniArena Control

betting:
  enabled: true
  min-bet: 100.0
  max-bet: 10000.0
  allow-spectator-bet: true
  bet-window-seconds: 30
